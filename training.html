<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS 5 × α7C II イベント撮影 3Dトレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1013; --panel:#17191e; --panel2:#1e2128; --line:#2b2f38; --text:#e9e7e2; --mute:#9aa0aa;
  --accent:#f5b83d; --pan:#2dd4bf; --roll:#a78bfa; --tilt:#fb923c; --good:#34d399; --bad:#f87171;
  --b:#60a5fa; --d:#fb7185; --m:#f5b83d; --a:#f472b6; --e:#34d399; --p:#9aa0aa;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{line-height:1.65}
header{padding:14px 16px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:900;letter-spacing:.02em}
header .sub{font-size:11.5px;color:var(--mute)}
@media (max-width:979px){ header{display:none} .navbtns{display:none} nav#levels{padding-top:10px} }
#stage{position:sticky;top:0;z-index:5;height:var(--sh,42vh);min-height:250px;transition:height .25s;background:#0b0c0f;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;touch-action:none}
#stage #c{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:rgba(15,16,19,.82);border:1px solid rgba(255,255,255,.18);color:#fff}
.lbl::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:rgba(255,255,255,.5)}
.lbl.pan{border-color:var(--pan);color:var(--pan)} .lbl.roll{border-color:var(--roll);color:var(--roll)} .lbl.tilt{border-color:var(--tilt);color:var(--tilt)}
.lbl.acc{border-color:var(--accent);color:var(--accent)} .lbl.good{border-color:var(--good);color:var(--good)} .lbl.bad{border-color:var(--bad);color:var(--bad)}
#inset{position:absolute;border:2px solid var(--accent);border-radius:6px;pointer-events:none;display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#inset span{position:absolute;left:6px;top:-11px;background:var(--accent);color:#111;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px}
#cap{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px;background:rgba(15,16,19,.85);border:1px solid var(--line);display:none}
#cap.good{border-color:var(--good);color:var(--good)} #cap.bad{border-color:var(--bad);color:var(--bad)} #cap.acc{border-color:var(--accent);color:var(--accent)}
#tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
#tools button,.seg button{font:inherit;font-size:12px;font-weight:700;color:var(--text);background:rgba(23,25,30,.9);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#hint{position:absolute;right:10px;top:10px;font-size:10.5px;color:var(--mute);background:rgba(15,16,19,.7);padding:3px 7px;border-radius:6px}
#modeBar{position:absolute;right:10px;bottom:10px;display:none}
#fest{display:none;position:absolute;inset:0;pointer-events:none}
#fClock{position:absolute;left:10px;top:10px;right:56px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#fClock b{font-size:22px;font-weight:900;background:rgba(15,16,19,.88);border:1px solid var(--d);color:var(--d);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums}
#fEv{font-size:13px;font-weight:700;background:rgba(15,16,19,.85);border-radius:8px;padding:5px 9px}
#fEv .must{display:inline-block;font-size:10.5px;font-weight:900;background:var(--bad);color:#111;border-radius:4px;padding:0 5px;margin-right:6px}
#fTodo{position:absolute;left:10px;top:54px;max-width:min(62%,420px);font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(15,16,19,.85);border:1px solid var(--accent);border-radius:8px;padding:5px 9px}
#fBar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;pointer-events:auto}
#fBar input{flex:1;accent-color:var(--d);height:28px}
#fMap{position:absolute;right:10px;top:54px;width:150px;height:90px;border-radius:8px;background:rgba(11,12,15,.82);border:1px solid var(--line)}
#fBig{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(86%,520px);text-align:center;background:rgba(15,16,19,.9);border:2px solid var(--d);border-radius:14px;padding:12px 14px;opacity:0;transition:opacity .35s;pointer-events:none}
#fBig.on{opacity:1}
#fView{position:absolute;right:10px;top:10px;display:flex;gap:4px;pointer-events:auto}
#fView button{font:inherit;font-size:12.5px;font-weight:700;color:var(--text);background:rgba(23,25,30,.92);border:1px solid var(--line);border-radius:9px;min-height:36px;padding:0 10px;cursor:pointer}
#fView button.on{background:var(--d);color:#111;border-color:var(--d)}
#fRec{position:absolute;left:0;right:0;display:none;justify-content:space-between;gap:10px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 3px #000}
#fRec .dot{color:#ef4444;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#fest.fp #fRec{display:flex}
#fest.fp #fMap{display:none}
@media (max-width:979px){ #fView{top:8px;right:50px} #fView button{padding:0 7px;font-size:11.5px;min-height:34px} #fClock{right:190px;flex-wrap:nowrap} #fEv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} #fClock b{font-size:18px} #fTodo{max-width:calc(100% - 20px)} }
@media (min-width:980px){ #fClock{right:260px} }
#fBig .t{font-size:30px;font-weight:900;color:var(--d);font-variant-numeric:tabular-nums}
#fBig .e{font-size:18px;font-weight:900;margin-top:2px}
#fBig .y{font-size:13px;color:var(--accent);margin-top:6px;font-weight:700}
@media (max-width:979px){ #fBig{top:36%;width:82%;padding:8px 10px} #fBig .t{font-size:22px} #fBig .e{font-size:15px} #fBig .y{font-size:12px} }
@media (max-width:979px){ #fMap{top:auto;bottom:60px;left:10px;right:auto;width:132px;height:80px} #fTodo{max-width:calc(100% - 66px)} }
#fBar button{font:inherit;font-size:13px;font-weight:700;color:var(--text);background:rgba(23,25,30,.92);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer}
#fBar #fSpeed{min-width:84px;color:var(--d);border-color:var(--d)}
#stage.festOn #tools,#stage.festOn #modeBar,#stage.festOn #hint{display:none!important}
.ftl .it{cursor:pointer;border-radius:8px;padding:4px 6px;margin-left:-6px}
.ftl .it.now{background:#2a1820;outline:1px solid var(--d)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--accent);color:#111;border-color:var(--accent)}
nav#levels{display:flex;gap:6px;padding:12px 12px 6px;overflow-x:auto;scrollbar-width:none}
nav#levels button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:900;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
nav#levels button.on{color:#111}
nav#levels .lablink{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px dashed var(--accent);border-radius:999px;padding:7px 12px;white-space:nowrap}
nav#steps{display:flex;gap:6px;padding:4px 12px 10px;overflow-x:auto;scrollbar-width:none}
nav#steps button{flex:0 0 auto;font:inherit;font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;max-width:220px;text-align:left}
nav#steps button.on{border-color:var(--lv);box-shadow:inset 0 0 0 1px var(--lv)}
nav#steps button b{color:var(--lv);margin-right:4px}
main{padding:0 14px 30px;max-width:760px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:900;color:#111;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.card h2{font-size:19px;margin:0 0 6px;line-height:1.4}
.lead{color:#d6d3cc;margin:0 0 10px;font-size:14.5px}
ul.pts{margin:0;padding-left:1.2em;font-size:14px} ul.pts li{margin:4px 0}
.box{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.drill{background:#1b2230;border:1px solid #2c3a52}
.pass{background:#142620;border:1px solid #1f4436}
.box b.h{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.drill b.h{color:#93c5fd} .pass b.h{color:var(--good)}
.warn{background:#2a1d14;border:1px solid #5a3a1d}
.warn b.h{color:var(--tilt)}
.src{margin-top:12px;font-size:11.5px;color:var(--mute)}
.src a{color:var(--mute);text-decoration:underline;text-underline-offset:2px;margin-right:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;text-align:left}
table.t th{color:var(--mute);font-weight:500;white-space:nowrap;width:30%}
.demo{margin-top:12px;background:#0b0c0f;border:1px solid var(--line);border-radius:10px;padding:10px}
.demo canvas{width:100%;display:block;border-radius:6px}
.demo .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mute)}
.verdict{font-weight:900;font-size:14px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.opt h3{margin:0 0 4px;font-size:14.5px}
.opt .now{font-size:10.5px;background:var(--accent);color:#111;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:900}
.pm{display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.pm span:nth-child(odd){font-weight:900}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.chk h4{margin:14px 0 2px;font-size:13px;color:var(--mute)}
.navbtns{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.navbtns button{font:inherit;font-size:13px;font-weight:700;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
footer{max-width:760px;margin:0 auto;padding:10px 14px 40px;font-size:11.5px;color:var(--mute)}
footer a{color:var(--mute)}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;color:var(--mute)}

#stage.big{--sh:66vh}
#bSize{position:absolute;right:10px;top:10px;font:inherit;font-size:16px;line-height:1;color:var(--text);background:rgba(23,25,30,.9);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer}
#hint{right:52px}
#bbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(15,16,19,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
#bbar button{font:inherit;font-size:18px;font-weight:900;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:52px;height:42px;cursor:pointer;flex:0 0 auto}
#bbTitle{flex:1;min-width:0;font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#bbTitle b{display:inline-block;color:#111;border-radius:4px;padding:0 5px;margin-right:5px;font-size:11px}
body{padding-bottom:70px}
details.srcs summary{cursor:pointer;color:var(--text);font-weight:700}
.kbd{font-size:11px;color:var(--mute);margin-top:8px}
.map svg{width:100%;height:auto;display:block;border-radius:10px;background:#0b0c0f;border:1px solid var(--line);margin-top:10px}
.tl{margin-top:10px;border-left:2px solid var(--line);padding-left:12px}
.tl .it{position:relative;margin:0 0 10px}
.tl .it::before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--d)}
.tl .tm{font-weight:900;color:var(--d);font-size:13px}
.tl .must{display:inline-block;font-size:10.5px;font-weight:900;background:var(--bad);color:#111;border-radius:4px;padding:0 5px;margin-left:6px}
.tl .sh{font-size:13px;color:#d6d3cc}
@media (min-width:980px){
  body{padding-bottom:0;overflow:hidden}
  #app{display:grid;grid-template-columns:minmax(0,1fr) 460px;height:100vh}
  #stage{position:relative;height:100vh!important;border:0;border-right:1px solid var(--line)}
  #side{height:100vh;overflow-y:auto}
  #bbar,#bSize{display:none}
  #hint{right:10px}
  nav#levels{flex-wrap:wrap}
  nav#steps button{max-width:none}
  main{padding:0 14px 20px}
  .opts{grid-template-columns:1fr}
}

</style>

</script>

<body>
<div id="app">
<div id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="inset"><span>カメラの映像</span></div>
  <div id="cap"></div>
  <div id="hint">ドラッグで回転・ピンチで拡大</div>
  <div id="tools"><button id="bPlay">❚❚ 一時停止</button><button id="bView">↺ 視点</button></div>

</div>
<div id="side">
<header>

</div>

const clamp01 = x => Math.max(0, Math.min(1, x));

function cyl(r,h,mat,axis='y',x=0,y=0,z=0,seg=20){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat); if(axis==='x')m.rotation.z=Math.PI/2; if(axis==='z')m.rotation.x=Math.PI/2; m.position.set(x,y,z); return m; }
const UP = new V3(0,1,0);
function placeBetween(m,a,b){ const d=new V3().subVectors(b,a); const L=d.length(); m.position.copy(a).addScaledVector(d,.5); m.scale.set(1,Math.max(L,1e-4),1); if(L>1e-6) m.quaternion.setFromUnitVectors(UP,d.normalize()); }
function ik(a,t,l1,l2,pole,elbow,end){
  const d=new V3().subVectors(t,a); let dist=d.length(); dist=Math.min(Math.max(dist,1e-3),l1+l2-1e-3); d.normalize();
  const x=(l1*l1-l2*l2+dist*dist)/(2*dist); const h=Math.sqrt(Math.max(0,l1*l1-x*x));
  const p=pole.clone().addScaledVector(d,-pole.dot(d)); if(p.lengthSq()<1e-8)p.set(0,0,1); p.normalize();
  elbow.copy(a).addScaledVector(d,x).addScaledVector(p,h); end.copy(a).addScaledVector(d,dist);
}

class Person{
  constructor(jacket=0x334155,pants=0x1f2937,skin=0xc9a68a){
    const G=this.group=new THREE.Group(); scene.add(G);
    const mj=stdMat(jacket,{r:.85}), mp=stdMat(pants,{r:.9}), ms=stdMat(skin,{r:.8}), mh=stdMat(0x2a211b,{r:.9}), msh=stdMat(0x111111,{r:.7});

    this.head=new THREE.Mesh(new THREE.SphereGeometry(.105,16,12),ms); G.add(this.head);
    this.hair=new THREE.Mesh(new THREE.SphereGeometry(.108,16,12,0,Math.PI*2,0,Math.PI*.55),mh); G.add(this.hair);
    const limb=(r,m)=>{ const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10),m); G.add(x); return x; };
    this.uaL=limb(.045,mj); this.faL=limb(.038,mj); this.uaR=limb(.045,mj); this.faR=limb(.038,mj);
    this.thL=limb(.06,mp); this.shL=limb(.05,mp); this.thR=limb(.06,mp); this.shR=limb(.05,mp);
    const j=(r,m)=>{ const s=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m); G.add(s); return s; };
    this.hdL=j(.04,ms); this.hdR=j(.04,ms); this.elL=j(.045,mj); this.elR=j(.045,mj); this.knL=j(.058,mp); this.knR=j(.058,mp);
    this.ftL=new THREE.Mesh(new THREE.BoxGeometry(.09,.06,.24),msh); this.ftR=this.ftL.clone(); G.add(this.ftL,this.ftR);
    this.anchor=new THREE.Group(); G.add(this.anchor);
    this.pelvisY=.9; this.lean=.06; this.footL=new V3(.11,.045,0); this.footR=new V3(-.11,.045,0);
    this.handL=new V3(.25,.85,.05); this.handR=new V3(-.25,.85,.05); this.rig=null;
  }
  attach(rig){ this.rig=rig; this.anchor.add(rig.root); }
  gait(phi,stride,lift){ this.footL.set(.11,.045+lift*Math.max(0,Math.cos(phi)),stride*Math.sin(phi)); this.footR.set(-.11,.045+lift*Math.max(0,Math.cos(phi+Math.PI)),stride*Math.sin(phi+Math.PI)); }
  update(){
    const p=this.pelvisY, G=this.group; G.updateMatrixWorld(true);
    this.torso.position.set(0,p+.3,0); this.torso.rotation.x=this.lean;
    const hy=p+.72; this.head.position.set(0,hy,.04*this.lean/.06); this.hair.position.copy(this.head.position).add(new V3(0,.012,-.008));
    if(this.rig){ this.rig.root.updateMatrixWorld(true);
      const a=this.rig.root.localToWorld(new V3(0,-.075,0)), b=this.rig.root.localToWorld(new V3(0,-.165,0));
      G.worldToLocal(a); G.worldToLocal(b); this.handR.copy(a).add(new V3(-.02,0,0)); this.handL.copy(b).add(new V3(.02,0,0)); }
    const sL=new V3(.19,p+.5,.02), sR=new V3(-.19,p+.5,.02), e=new V3(), h=new V3();
    ik(sL,this.handL,.29,.27,new V3(.7,-1,-.6),e,h); placeBetween(this.uaL,sL,e); placeBetween(this.faL,e,h); this.elL.position.copy(e); this.hdL.position.copy(h);
    ik(sR,this.handR,.29,.27,new V3(-.7,-1,-.6),e,h); placeBetween(this.uaR,sR,e); placeBetween(this.faR,e,h); this.elR.position.copy(e); this.hdR.position.copy(h);
    const hL=new V3(.1,p,0), hR=new V3(-.1,p,0);
    ik(hL,this.footL,.45,.44,new V3(0,.2,1),e,h); placeBetween(this.thL,hL,e); placeBetween(this.shL,e,h); this.knL.position.copy(e); this.ftL.position.set(h.x,h.y-.01,h.z+.05);
    ik(hR,this.footR,.45,.44,new V3(0,.2,1),e,h); placeBetween(this.thR,hR,e); placeBetween(this.shR,e,h); this.knR.position.copy(e); this.ftR.position.set(h.x,h.y-.01,h.z+.05);
  }
}

/* ---------------- follow sim ---------------- */
function follow(rig,hy,hp,hr,mode,dt,tau,cmdPitch=0,cmdYaw=0){
  const a=1-Math.exp(-dt/Math.max(tau,1e-3)); const c=rig.cs;
  let ty=c.yaw,tp=c.pitch,tr=0;
  if(mode==='PF'){ty=hy+cmdYaw;tp=cmdPitch;}
  else if(mode==='PTF'){ty=hy+cmdYaw;tp=hp+cmdPitch;}
  else if(mode==='FPV'){ty=hy;tp=hp;tr=hr;}
  else if(mode==='LOCK'){ty=c.lockY??0;tp=c.lockP??0;}
  c.yaw+= (ty-c.yaw)*a; c.pitch+=(tp-c.pitch)*a; c.roll+=(tr-c.roll)*a;
  rig.setHandle(hy,hp,hr); rig.aim(c.yaw,c.pitch,c.roll);
}

const PATHS={
 push:u=>{ const s=seg(u,.12,.88); return {x:0,z:lerp(-1.6,1.0,s),yaw:0,moving:u>.12&&u<.88}; },
 pull:u=>{ const s=seg(u,.12,.88); return {x:0,z:lerp(1.0,-1.6,s),yaw:0,moving:u>.12&&u<.88}; },
 track:u=>{ const s=seg(u,.1,.9); return {x:lerp(-3.2,3.2,s),z:4.4,yaw:Math.PI/2,camYaw:-Math.PI/2,moving:u>.1&&u<.9}; },
 reveal:u=>{ const s=seg(u,.2,.8); return {x:lerp(-1.75,-.25,s),z:-1.25,yaw:yawTo(lerp(-1.75,-.25,s),-1.25,0,6),moving:u>.2&&u<.8}; },
 orbit:u=>{ const s=seg(u,.1,.9); const a=lerp(-1.1,1.1,s); const cx=-3.6,cz=-2.3,r=1.7; const x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r; return {x,z,yaw:yawTo(x,z,cx,cz),pitch:-.05,moving:u>.1&&u<.9}; },
 low:u=>{ const s=seg(u,.12,.88); return {x:.0,z:lerp(-1.6,.9,s),yaw:0,inv:true,moving:u>.12&&u<.88}; },
 boom:u=>{ const s=seg(u,.15,.8); return {x:4.6,z:1.2,yaw:yawTo(4.6,1.2,0,6),boom:s,moving:false}; },
};
function moveStep(o){ return Object.assign({inset:true,cam:{p:[-5.5,4.2,-4.8],t:[0,.8,2]},
  setup(){ op.group.visible=true; lastPos=null; opRig.cs={yaw:0,pitch:0,roll:0}; opRig.zoom=0; opRig.apply(); },
  update(t,dt){ const P=o.period||9; const u=(t%P)/P; const q=PATHS[o.path](u); placeOp(q.x,q.z,q.yaw); lastMoving=q.moving;
    opRig.inverted=!!q.inv; let crouch=.07, anchorY=1.12, pitch=q.pitch||0, hp=0;
    if(q.inv){ anchorY=.72; crouch=.24; }
    if(q.boom!==undefined){ anchorY=lerp(.55,2.0,q.boom); crouch=lerp(.38,0,Math.min(1,q.boom*1.6)); }
    if(o.high){ anchorY=1.95; crouch=0; pitch=-.28; }
    op.anchor.position.set(0,anchorY,q.inv?.42:.32);
    walkAnim(dt,crouch); opRig.setHandle(0,hp,0); opRig.aim(q.camYaw||0,pitch,0);
    o.cap&&cap(o.cap(u),'acc'); }},o); }

     document.getElementById('fSet').textContent=`4K 24p ・ 1/50 ・ F${opRig.zoom>.3?'2.8':'4'} ・ ${Math.round(24+46*opRig.zoom)}mm ・ ${opRig.inverted?'逆さ持ち':'PF'}`; }
   if(fState.view==='tp'){ const k=fState.snap?1:1-Math.exp(-rdt*3); camera.position.lerp(fState.tpPos,k); controls.target.lerp(fState.tpTgt,k); fState.snapTp=false; }
   if(fState.view!=='tp'&&!userMoved&&!camTween){ const f=M.p.clone().lerp(O.p,.4); const near=!M.moving; const cp=near?new V3(f.x+4,11,f.z+11):new V3(f.x+5,24,f.z+15); const k=fState.snap?1:1-Math.exp(-rdt*2.5); fState.snap=false; camera.position.lerp(cp,k); controls.target.lerp(new V3(f.x,.8,f.z),k); }
   cap(''); }};
const fsState={k:1};
SD.unshift(festStep);

S.unshift(...SD);

/* ---------------- UI ---------------- */
const levelsEl=document.getElementById('levels'), stepsEl=document.getElementById('steps'), mainEl=document.getElementById('main');
let cur=0, curLv='p', stepT=0;
function renderLevels(){ levelsEl.innerHTML=''; Object.entries(LV).forEach(([k,[name,col]])=>{ const b=document.createElement('button'); const n=S.filter(s=>s.lv===k).length; b.textContent=name; if(k===curLv){b.className='on'; b.style.background=col; b.style.borderColor=col;} b.onclick=()=>go(S.findIndex(s=>s.lv===k)); levelsEl.appendChild(b); }); const a=document.createElement('a'); a.href='index.html'; a.target='_self'; a.rel='noopener'; a.textContent='📱 練習ラボ'; a.className='lablink'; levelsEl.appendChild(a); }
function renderSteps(){ stepsEl.innerHTML=''; stepsEl.style.setProperty('--lv',LV[curLv][1]); S.forEach((s,i)=>{ if(s.lv!==curLv)return; const n=S.filter((x,j)=>x.lv===curLv&&j<=i).length; const b=document.createElement('button'); b.innerHTML=`<b>${n}</b>${s.title}`; if(i===cur)b.className='on'; b.onclick=()=>go(i); stepsEl.appendChild(b); if(i===cur)setTimeout(()=>b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}),30); }); }
const modeBar=document.getElementById('modeBar'), modeSeg=document.getElementById('modeSeg');
function renderModes(s){ if(!s.modes){modeBar.style.display='none';modeSeg.innerHTML='';return;} modeBar.style.display='block'; modeSeg.innerHTML='';
  const st=s.modeKey==='speed'?speedState:s.modeKey==='pos'?posState:s.modeKey==='fmode'?fState:modeState, key=s.modeKey==='speed'||s.modeKey==='pos'?'k':'mode';
  ((window.innerWidth<980&&s.modesShort)||s.modes).forEach(([v,label])=>{ const b=document.createElement('button'); b.textContent=label; if(st[key]===v)b.className='on'; b.onclick=()=>{ st[key]=v; if(key==='mode'){ opRig.cs.lockY=opRig.cs.yaw; opRig.cs.lockP=opRig.cs.pitch; } demos.speed&&demos.speed.clear(); renderModes(s); }; modeSeg.appendChild(b); }); }
function renderCard(s){ const [lvName,col]=LV[s.lv]; const idx=S.filter((x,j)=>x.lv===s.lv&&j<=cur).length;
  const html=typeof s.html==='function'?s.html():(s.html||'');
  mainEl.innerHTML=`<div class="card"><span class="tag" style="background:${col}">${lvName} ${idx}</span><h2>${s.title}</h2><p class="lead">${s.lead||''}</p>
  ${s.pts?`<ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}${html}
  ${s.warn?`<div class="box warn"><b class="h">注意</b>${s.warn}</div>`:''}
  ${s.drill?`<div class="box drill"><b class="h">練習メニュー</b>${s.drill}</div>`:''}
  ${s.pass?`<div class="box pass"><b class="h">合格ライン</b>${s.pass}</div>`:''}
  ${s.src?`<div class="src">出典：${s.src.map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a>`).join('')}</div>`:''}
  <div class="navbtns"><button id="prevB">← 前へ</button><button id="nextB">次へ →</button></div></div>`;
  document.getElementById('prevB').onclick=()=>go(Math.max(0,cur-1)); document.getElementById('nextB').onclick=()=>go(Math.min(S.length-1,cur+1)); }
function resetWorld(){
  clearLabels(); cap(''); arrow1.visible=arrow2.visible=false; trail1.line.visible=trail2.line.visible=false; mapGroup.visible=false;
  deskRig.reset(); deskRig.root.visible=false; deskRig.root.position.set(...DESK); deskRig.legs.visible=true;
  opRig.reset(); op2Rig.reset(); op.group.visible=false; op2.group.visible=false; op.pelvisY=.9; op.lean=.06; op.gait(0,0,0); op2.gait(0,0,0); op.anchor.position.set(0,1.12,.32); op2.anchor.position.set(0,1.12,.32); op.group.rotation.set(0,0,0);
  hidePeople(); document.getElementById('fest').style.display='none'; stageEl.classList.remove('festOn'); scene.background.set(0x101114); scene.fog.color.set(0x101114); scene.fog.near=14; scene.fog.far=34; if(autoBig){ stageEl.classList.remove('big'); autoBig=false; } stageLightA.intensity=12; stageLightB.intensity=10; for(const k in demos) delete demos[k]; lastMoving=false; lastPos=null;
}
function go(i){ cur=i; const s=S[i]; curLv=s.lv; stepT=0; resetWorld(); s.setup&&s.setup.call(s); renderLevels(); renderSteps(); renderCard(s); renderModes(s); s.mount&&s.mount.call(s); if(s.cam)goCam(s.cam.p,s.cam.t); insetOn=!!s.inset; const side=document.getElementById('side'); if(side.scrollHeight>side.clientHeight+5) side.scrollTo({top:0,behavior:'smooth'}); else window.scrollTo({top:0,behavior:'smooth'});
  const n=S.filter((x,j)=>x.lv===s.lv&&j<=i).length, tot=S.filter(x=>x.lv===s.lv).length; document.getElementById('bbTitle').innerHTML=`<b style="background:${LV[s.lv][1]}">${LV[s.lv][0]} ${n}/${tot}</b>${s.title}`; }
document.getElementById('bbPrev').onclick=()=>go(Math.max(0,cur-1)); document.getElementById('bbNext').onclick=()=>go(Math.min(S.length-1,cur+1));
document.getElementById('bSize').onclick=()=>stageEl.classList.toggle('big');
window.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.key==='ArrowRight')go(Math.min(S.length-1,cur+1)); if(e.key==='ArrowLeft')go(Math.max(0,cur-1)); if(e.key===' '){ e.preventDefault(); document.getElementById('bPlay').click(); } });
let insetOn=false; let rdt=.016; let autoBig=false;
let playing=true; document.getElementById('bPlay').onclick=e=>{ playing=!playing; e.target.textContent=playing?'❚❚ 一時停止':'▶ 再生'; };
document.getElementById('bView').onclick=()=>{ const s=S[cur]; if(s.cam)goCam(s.cam.p,s.cam.t); };

// footer sources
document.getElementById('foot').innerHTML='<details class="srcs"><summary>参考にした情報源（'+Object.keys(SRC).length+'件）</summary>'+Object.values(SRC).map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' ／ ')+'</details><p>イベントの時刻・ルート・内容は主催者のチラシ（当日タイムスケジュール）によります。3Dモデルは説明用の簡易モデルで、実機の形状・寸法・会場の配置とは異なります。ボタン操作は初期設定の場合です。</p><p class="kbd">PC：← → キーでステップ移動、スペースで一時停止</p><p><a href="index.html" style="color:var(--accent)">📱 スマホのセンサーで練習する（ジンバル練習ラボ）</a></p>';

/* ---------------- loop ---------------- */
const insetEl=document.getElementById('inset');
let W=1,H=1;
function resize(){ W=stageEl.clientWidth; H=stageEl.clientHeight; renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stageEl); resize();
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05); rdt=dt; if(playing) stepT+=dt;
  const s=S[cur];
  if(camTween){ camTween.k+=dt/camTween.dur; const k=ez(camTween.k); camera.position.lerpVectors(camTween.fp,camTween.tp,k); controls.target.lerpVectors(camTween.ft,camTween.tt,k); if(camTween.k>=1)camTween=null; }
  if(playing||true){ s.update&&s.update.call(s,stepT,playing?dt:0); }
  if(op.group.visible) op.update(); if(op2.group.visible) op2.update(); dayPeople.forEach(p=>{ if(p.group.visible) p.update(); });
  speaker.handR.set(-.24,.86+.12*Math.max(0,Math.sin(stepT*1.3)),.12); speaker.update(); guest.update();
  controls.update();
  const fpMode=(s===festStep&&fState.view==='fp'); fLines.forEach(l=>l.visible=!fpMode);
  labelLayer.style.display=fpMode?'none':'block';
  if(fpMode){ // 一人称：16:9のモニター表示＋右下に俯瞰
    renderer.setScissorTest(true); renderer.setScissor(0,0,W,H); renderer.setViewport(0,0,W,H); renderer.setClearColor(0x000000); renderer.clear();
    let vw=W, vh=Math.round(W*9/16); if(vh>H-150){ vh=H-150; vw=Math.round(vh*16/9); } const vx=Math.round((W-vw)/2), vy=Math.round(H-vh-(W<980?120:70));
    const bob=lastMoving?.006*Math.sin(stepT*11):0; opRig.vcam.position.y=bob;
    opRig.vcam.aspect=16/9; opRig.vcam.updateProjectionMatrix(); renderer.setScissor(vx,vy,vw,vh); renderer.setViewport(vx,vy,vw,vh); renderer.render(scene,opRig.vcam); opRig.vcam.position.y=0;
    const rec=document.getElementById('fRec'); rec.style.top=(H-vy-vh)+'px'; rec.style.left=vx+'px'; rec.style.width=vw+'px'; rec.style.right='auto';
    const iw=Math.round(W>=900?Math.min(W*.24,320):Math.min(W*.42,200)), ih=Math.round(iw*.62), m=10; const x=W-iw-m, y=60;
    renderer.setScissor(x,y,iw,ih); renderer.setViewport(x,y,iw,ih); const pa=camera.aspect; camera.aspect=iw/ih; camera.updateProjectionMatrix(); renderer.render(scene,camera); camera.aspect=pa; camera.updateProjectionMatrix(); renderer.setScissorTest(false);
    insetEl.style.display='block'; insetEl.querySelector('span').textContent='俯瞰'; insetEl.style.left=x+'px'; insetEl.style.top=(H-y-ih)+'px'; insetEl.style.width=iw+'px'; insetEl.style.height=ih+'px';
  } else {
  insetEl.querySelector('span').textContent='カメラの映像';
  renderer.setScissorTest(false); renderer.setViewport(0,0,W,H); renderer.render(scene,camera);
  if(insetOn&&op.group.visible){ const iw=Math.round(W>=900?Math.min(W*.42,560):Math.min(W*.48,300)), ih=Math.round(iw*9/16), m=10; const x=W-iw-m, y=m+(s.insetY||(s.modes?40:0));
    opRig.vcam.aspect=16/9; opRig.vcam.updateProjectionMatrix(); renderer.setScissorTest(true); renderer.setScissor(x,y,iw,ih); renderer.setViewport(x,y,iw,ih);
    const ov=op.group.visible; renderer.render(scene,opRig.vcam); renderer.setScissorTest(false);
    insetEl.style.display='block'; insetEl.style.left=x+'px'; insetEl.style.top=(H-y-ih)+'px'; insetEl.style.width=iw+'px'; insetEl.style.height=ih+'px'; }
  else insetEl.style.display='none';
  }
  updateLabels(W,H);
  for(const k in demos){ const d=demos[k]; if(typeof d==='function') d(stepT); else d.draw&&d.draw(); }
  requestAnimationFrame(frame);
}
camera.position.set(2,2,-7); controls.target.set(0,1,-5);
go(0); frame(); window.__ok=true; setTimeout(()=>{const h=document.getElementById('hint'); h.style.transition='opacity .6s'; h.style.opacity='0';},6000);
</script>
